
services:
  postgres:
    image: postgres:17-alpine
    container_name: project_manager_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: project_user
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: project_manager

    ports:
      - "127.0.0.1:54329:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U project_user -d project_manager
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    build:
      context: ./docker/minio
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    image: project-manager-minio:local
    container_name: project_manager_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-project_manager_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-project_manager_minio_secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:9000/minio/health/live || exit 1
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    container_name: project_manager_migrate
    environment:
      DATABASE_URL: postgresql://project_user:local_dev_password@postgres:5432/project_manager?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      target: seed
    container_name: project_manager_seed
    environment:
      DATABASE_URL: postgresql://project_user:local_dev_password@postgres:5432/project_manager?schema=public
      ADMIN_NAME: ${ADMIN_NAME:-System Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  app:
    build:
      context: .
      target: runner
    container_name: project_manager_app
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      DATABASE_URL: postgresql://project_user:local_dev_password@postgres:5432/project_manager?schema=public
      LOGIN_RATE_LIMIT_SECRET: ${LOGIN_RATE_LIMIT_SECRET:-local-development-rate-limit-secret}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-project_manager_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-project_manager_minio_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-task-attachments}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      seed:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/v1/ready || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  minio_data:
